name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Self-test (core logic)
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import openpyxl
          wb = openpyxl.Workbook(); ws = wb.active
          ws.append(["货场退货报表"])
          ws.append(["序号", "物品编码", "物品名称", "数量", "扫码"])
          for i, c in enumerate(
              ["6901234567890", "6901234567891", "6901234567892",
               "6901234567893", "6901234567894"], 1):
              ws.append([i, c, "商品%d" % i, 10, "2026-09-09"])
          wb.save("sample.xlsx")
          PY
          ./target/x86_64-pc-windows-msvc/release/barcode_tool.exe --selftest sample.xlsx selftest_out 2
          echo "--- generated files ---"
          ls selftest_out

      - name: Determine version
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compress with UPX (size reduction)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx -Force
          .\upx\upx-4.2.4-win64\upx.exe --best --lzma target/x86_64-pc-windows-msvc/release/barcode_tool.exe
          echo "--- UPX 压缩后大小 ---"
          (Get-Item target/x86_64-pc-windows-msvc/release/barcode_tool.exe).Length

      - name: Copy versioned executable
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}"
          $src = "target/x86_64-pc-windows-msvc/release/barcode_tool.exe"
          $dst = "target/x86_64-pc-windows-msvc/release/barcode_tool_v$v.exe"
          Copy-Item $src -Destination $dst -Force
          echo "--- 版本化产物 ---"
          Get-Item $dst | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: barcode_tool_v${{ env.VERSION }}
          path: target/x86_64-pc-windows-msvc/release/barcode_tool_v${{ env.VERSION }}.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/x86_64-pc-windows-msvc/release/barcode_tool_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
