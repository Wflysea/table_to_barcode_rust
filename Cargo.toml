[package]
name = "barcode_tool"
version = "1.2.0"
edition = "2021"
description = "从 Excel 指定列生成一维条形码图片（Rust 重写版）"
license = "MIT"

[dependencies]
calamine = "0.36"
barcoders = { version = "2.0.0", features = ["image"] }
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
eframe = "0.36"
rfd = "0.17"
anyhow = "1"
open = "5"

[profile.release]
opt-level = 3
strip = true
