[package]
name = "barcode_tool"
version = "2.0.1"
edition = "2021"
description = "从 Excel 指定列生成一维条形码图片（Rust 重写版）"
license = "MIT"

[dependencies]
calamine = "0.36"
barcoders = { version = "2.0.0", features = ["image"] }
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
eframe = "0.36"
rfd = "0.17"
anyhow = "1"
open = "5"

[profile.release]
# 体积优先优化：opt-level=z 按体积而非速度优化；lto+codegen-units=1 跨 crate 内联去重；
# panic=abort 去掉 unwind 运行时；strip 去除调试符号。
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
